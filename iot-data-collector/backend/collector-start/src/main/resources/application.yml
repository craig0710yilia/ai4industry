server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: iot-data-collector
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iot_collector}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

collector:
  backup:
    directory: ${BACKUP_DIR:./backups}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
    cron: "0 0 2 1 * ?"

logging:
  level:
    com.htw.collector: DEBUG
    org.eclipse.milo: INFO
